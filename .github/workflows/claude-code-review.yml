name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Prevent race conditions when multiple PRs trigger simultaneously
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Workaround for anthropics/claude-code-action#1290 (open upstream).
      # `claude install` exits 0 even when $HOME/.local/bin does not exist, so the
      # action's installClaudeCode() returns a path to a binary that was never
      # placed there and the SDK dies with errorClass "executable_not_found".
      # Hit on PR #59, runs 34285639720 and 34292898151. Creating the directory up
      # front is enough for the installer to land the binary. Delete this step once
      # the upstream fix ships.
      - name: Pre-create ~/.local/bin
        run: mkdir -p "$HOME/.local/bin"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Adversarial code review. Assume the diff contains at least one real defect and find it; waving the PR through without tracing the changed code's behavior is a failed review.

            Run `gh pr diff ${{ github.event.pull_request.number }}` for the diff. Focus on it, but you are NOT confined to it: use Read/Grep/Glob to open callers/callees of changed functions, types, and contracts and confirm the change doesn't break them. Cross-file breakage is in scope.

            Check: logic bugs, null/undefined, races, off-by-one, wrong error handling, broken callers; perf (O(n²) hot paths, unbounded loops over chat history, missing pagination); security (injection, API key exposure, secrets in logs, XSS in rendered markdown); test gaps (changed logic untested, tests asserting nothing, happy-path-only).

            Flag ANY of these CLAUDE.md violations in changed code as HIGH: `any` type (strict mode is on); relative import instead of the `@/*` alias; plain `fetch(` against an external API instead of `tauriFetch` from `@tauri-apps/plugin-http` (CORS bypass — see the Troubleshooting section of CLAUDE.md); silent error-swallowing catch; a new AI or STT provider added anywhere other than `config/ai-providers.constants.ts` / `config/stt.constants.ts`.

            Severity by PLAUSIBILITY, not certainty:
            - **CRITICAL**: could plausibly cause a security breach, data loss, API key leakage, or a crash on launch.
            - **HIGH**: could plausibly cause a bug, crash, wrong result, or broken caller under realistic input — or a hard-rule violation above.
            - **MEDIUM**: real concern unlikely to fire, or narrow edge case. Report it (own section).
            - **NIT**: pure style, no correctness impact → skip.
            Don't downgrade to stay silent: if a reasonable input reaches the defect, report it. Every finding needs a concrete FAILURE SCENARIO (input/state → wrong output/crash/violated invariant); no scenario = not a finding.

            Write the review to `review.md` in the repo root: a one-line **Scope** header (files reviewed + callers traced), then `## Critical` / `## High` / `## Medium` sections (each: `path:line`, one-line defect, failure scenario), omitting empty sections. If nothing is found after genuinely tracing, still write the Scope header + "✅ No critical, high, or medium issues found" — a bare no-issues line without Scope is not acceptable.

            Use CLAUDE.md for conventions. Do NOT run npm/cargo/build/test — static review only.

          claude_args: '--model claude-opus-4-8 --allowed-tools "Write,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*)"'

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
          else
            # Verdict-artifact guard: the review step can "succeed" without ever
            # writing review.md (e.g. tool permission denials). Downstream
            # automation (fix-pr-reviews --loop) must be able to distinguish
            # "clean review" from "review never happened" — a clean review posts
            # an explicit "No critical issues found" comment, so a missing file
            # means the review did not complete. Fail the run.
            echo "::error::Review produced no review.md verdict artifact — review did not complete (check the review step logs for tool permission denials)."
            exit 1
          fi
