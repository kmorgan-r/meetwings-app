name: "publish"

on:
  push:
    branches:
      - main

# GitHub dispatched two identical runs for commit 88d6b84, and both raced to
# upload the same asset names - one won, the other died on "already_exists".
# Serialize instead of cancelling: a cancelled run can leave a release
# half-populated, and a duplicate that merely repeats the uploads is harmless.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # This workflow runs on every push to main, but the release it targets is
  # named after the version in package.json. Merging anything without bumping
  # that version therefore rebuilds the *existing* release and replaces its
  # binaries, so a published version stops meaning one fixed set of artifacts.
  # Skip the build in that case; a bump is what asks for a new release.
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          # A draft is still fair game: re-running a release that has not been
          # published yet is how you replace a bad build.
          if [ "$(gh release view "app-v$version" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "app-v$version is already published - skipping build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `bundles` lists "<glob>:<stable name>" pairs. The stable names are
        # what https://github.com/.../releases/latest/download/<name> resolves
        # to, which is how the website links to the current build without being
        # edited every release. Tauri's own filenames carry the version, so they
        # can't serve that purpose.
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            bundles: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg:Meetwings-macos-arm64.dmg"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            bundles: "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg:Meetwings-macos-x64.dmg"
          - platform: "ubuntu-22.04"
            args: ""
            bundles: "src-tauri/target/release/bundle/deb/*.deb:Meetwings-linux-x64.deb src-tauri/target/release/bundle/appimage/*.AppImage:Meetwings-linux-x64.AppImage src-tauri/target/release/bundle/rpm/*.rpm:Meetwings-linux-x64.rpm"
          - platform: "windows-latest"
            args: ""
            bundles: "src-tauri/target/release/bundle/nsis/*-setup.exe:Meetwings-windows-x64-setup.exe src-tauri/target/release/bundle/msi/*.msi:Meetwings-windows-x64.msi"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system deps (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libgtk-3-dev pkg-config \
            libasound2-dev libpulse-dev fuse libfuse2 squashfs-tools \
            xz-utils wget file libglib2.0-dev libgdk-pixbuf2.0-dev libcairo-gobject2 \
            libayatana-appindicator3-dev ca-certificates binutils
          sudo update-ca-certificates -f

      - name: Create environment file
        run: |
          echo "API_ACCESS_KEY=${{ secrets.API_ACCESS_KEY }}" > src-tauri/.env
          echo "PAYMENT_ENDPOINT=${{ secrets.PAYMENT_ENDPOINT }}" >> src-tauri/.env
          echo "APP_ENDPOINT=${{ secrets.APP_ENDPOINT }}" >> src-tauri/.env
          echo "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> src-tauri/.env

      - name: Install frontend deps
        run: npm ci

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0.5.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
          PAYMENT_ENDPOINT: ${{ secrets.PAYMENT_ENDPOINT }}
          APP_ENDPOINT: ${{ secrets.APP_ENDPOINT }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Meetwings v__VERSION__"
          releaseBody: "Download binaries for your OS. macOS users: If blocked, go to System Settings > Privacy & Security > Security section, find 'meetwings was blocked' message, click 'Allow Anyway', then reopen the app."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Same binaries, uploaded a second time under a name that does not change
      # between releases, so the download links on meetwings.com keep working.
      # The versioned originals stay put — the updater's latest.json refers to
      # those by name.
      - name: Upload stable-name copies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p _aliases
          # Split the pair list with pathname expansion off. Every entry
          # contains a `*`, so bash tries to glob the whole "<glob>:<name>"
          # word, which matches no file - and under `nullglob` a non-matching
          # pattern is dropped from the list outright, so the loop ran zero
          # times and uploaded nothing while still exiting 0.
          set -f
          pairs=( ${{ matrix.bundles }} )
          set +f
          for pair in "${pairs[@]}"; do
            src="${pair%%:*}"
            dest="${pair##*:}"
            matches=( $src )
            # Fail loudly: a silently missing copy is a dead download button on
            # the website, which nothing else would catch. Without nullglob a
            # pattern that matches nothing stays literal, so the -e test is what
            # catches that case.
            if [ ${#matches[@]} -ne 1 ] || [ ! -e "${matches[0]}" ]; then
              echo "::error::expected exactly 1 bundle matching $src, got: ${matches[*]}"
              exit 1
            fi
            cp "${matches[0]}" "_aliases/$dest"
            gh release upload "app-v$version" "_aliases/$dest" --clobber
            echo "uploaded $dest"
          done
