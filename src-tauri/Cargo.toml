[package]
name = "meetwings"
version = "1.0.2"
description = "Your invisible AI wingman for meetings and conversations. An open-source, privacy-first AI assistant that provides real-time support during meetings, interviews, and conversations - completely undetectable."
authors = ["Kevin Morgan-Rothschild <kmorganr@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/kmorgan-r/meetwings-app"
homepage = "https://meetwings.com"
documentation = "https://github.com/kmorgan-r/meetwings-app/wiki"
readme = "../README.md"
keywords = ["ai-assistant", "meetwings", "meeting-wingman", "privacy-first", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meetwings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenv = "0.15"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.9.0"
tauri-plugin-http = "2.5.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-keychain = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
# Graph OAuth. `base64` (0.22) is already present above and covers the
# URL-safe encoding PKCE needs; `reqwest` covers the token and data calls.
sha2 = "0.10"           # PKCE S256 challenge
rand = "0.8"            # verifier, state, nonce - CSPRNG, never a counter
url = "2"               # authorize-URL construction and callback parsing
# refresh token at rest. Probe 2 (Task 1) found no Rust-side API on
# tauri-plugin-keychain on desktop, so this crate carries the keychain
# instead. keyring 3.x has NO default platform backend - every OS store is
# gated behind an explicit feature, and with none enabled it silently falls
# back to an in-memory mock (keyring-3.6.3/src/lib.rs: `not(feature =
# "windows-native")` etc. each `pub use mock as default`), which would make
# "at rest" actually mean "until process exit." windows-native/apple-native
# pull only additional Rust deps (windows-sys / security-framework), so
# enabling both here is safe regardless of the host platform doing the
# build; the crate's own manifest target-gates their transitive deps.
# Linux is deliberately left on the mock fallback: its only persistent
# option (sync-secret-service) pulls dbus-secret-service, which needs
# libdbus at build time - an unverified CI/runtime dependency this task
# does not add unilaterally. FINDING for the controller: decide the Linux
# keychain backend before Task 9 ships a Linux build.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
dotenv = "0.15"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ringbuf = "0.4.8"
tauri-plugin-shell = "2.3.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-posthog = "0.2.4"
tauri-plugin-machine-uid = "0.1.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
cidre = "0.11.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.0"
